def versions = [:]
versions.gdx = '1.12.1'
versions.junit = '5.10.2'

def deps = [:]

def gdx = [:]
gdx.gdx = "com.badlogicgames.gdx:gdx:$versions.gdx"
gdx.backend_lwjgl3 = "com.badlogicgames.gdx:gdx-backend-lwjgl3:$versions.gdx"
gdx.platform_desktop = "com.badlogicgames.gdx:gdx-platform:$versions.gdx:natives-desktop"
deps.gdx = gdx

def junit = [:]
junit.bom = "org.junit:junit-bom:$versions.junit"
junit.jupiter = "org.junit.jupiter:junit-jupiter"
junit.launcher = "org.junit.platform:junit-platform-launcher"
deps.junit = junit

ext.deps = deps
